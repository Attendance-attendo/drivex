<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX - Fixed Antique Gauge</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Times New Roman', Times, serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #d4c39e;
            background: rgba(20,20,20,0.85);
            padding: 12px 18px;
            border-radius: 8px;
            border: 2px solid #b8a47e;
            pointer-events: none;
            font-family: sans-serif;
        }
        
        /* GAUGE CONTAINER */
        #retro-gauge {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #f4eee2 60%, #dcd2be 100%);
            border: 8px solid;
            border-color: #e5d8b5 #a6936d #6b5c3f #c8b793;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 25px rgba(70,55,30,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* DIAL LABELS & TEXT */
        .dial-number {
            position: absolute;
            font-size: 11px;
            font-weight: bold;
            color: #2b2b2b;
            font-family: 'Courier New', Courier, monospace;
            width: 25px;
            text-align: center;
        }

        #dial-brand {
            position: absolute;
            top: 52px;
            font-size: 7px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #3a3325;
            text-align: center;
            width: 100%;
        }

        #dial-subtext {
            position: absolute;
            bottom: 52px;
            font-size: 8px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #3a3325;
            text-align: center;
            width: 100%;
        }

        /* DIGITAL GEAR DISPLAY */
        #gear-box {
            position: absolute;
            top: 72px;
            background: rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.2);
            padding: 0px 6px;
            border-radius: 4px;
        }
        #gear-indicator {
            font-size: 14px;
            font-weight: bold;
            color: #a02020;
            font-family: monospace;
        }

        /* ANALOG NEEDLE (Anchored at Center) */
        #needle-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-135deg);
            transition: transform 0.05s linear;
        }

        #needle {
            position: absolute;
            width: 3px;
            height: 70px;
            background: #1a1a1a;
            bottom: 50%;
            border-radius: 2px 2px 0 0;
        }

        #needle-hub {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #555 30%, #111 100%);
            border: 1px solid #888;
            border-radius: 50%;
            z-index: 10;
        }

        #digital-speed {
            position: absolute;
            bottom: 32px;
            font-size: 11px;
            font-weight: bold;
            color: #444;
            font-family: monospace;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3 style="margin: 0 0 5px 0;">DriveX - Antique Edition</h3>
        <p style="margin: 3px 0;">Use <b>WASD</b> or <b>Arrow Keys</b> to drive.</p>
    </div>

    <!-- ANTIQUE GAUGE -->
    <div id="retro-gauge">
        <div id="dial-brand">BETHLEHEM STEEL CO.</div>
        <div id="gear-box"><span id="gear-indicator">P</span></div>
        <div id="dial-subtext">COMPRESSED AIR</div>
        
        <!-- Rotating Needle Container -->
        <div id="needle-container">
            <div id="needle"></div>
        </div>
        <div id="needle-hub"></div>
        
        <div id="digital-speed">0 KM/H</div>
    </div>

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Generate Dial Numbers cleanly in a full circle arc (-135deg to +135deg)
        const gaugeContainer = document.getElementById('retro-gauge');
        const radius = 75; // Distance from center
        const centerX = 110;
        const centerY = 110;

        for (let i = 0; i <= 12; i++) {
            const val = i * 25; // 0 to 300
            // Map 0-12 steps to -135deg to +135deg (270 degree total sweep)
            const angleDeg = -135 + (i / 12) * 270;
            const angleRad = (angleDeg - 90) * (Math.PI / 180);
            
            const x = centerX + radius * Math.cos(angleRad) - 12;
            const y = centerY + radius * Math.sin(angleRad) - 8;
            
            const numDiv = document.createElement('div');
            numDiv.className = 'dial-number';
            numDiv.style.left = `${x}px`;
            numDiv.style.top = `${y}px`;
            numDiv.innerText = val;
            gaugeContainer.appendChild(numDiv);
        }

        // 1. Scene & Camera Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 3. Ground & Grid
        const mapSize = 180;
        const groundGeometry = new THREE.PlaneGeometry(mapSize, mapSize);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x2b2b30, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const grid = new THREE.GridHelper(mapSize, 40, 0x8c7853, 0x3a3a40);
        grid.position.y = 0.01;
        scene.add(grid);

        // 4. Boundary Crash Walls
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x8c7853, roughness: 0.4 });
        const wallHeight = 3;
        const wallThickness = 2;
        const halfMap = mapSize / 2;

        function createWall(x, z, width, depth) {
            const wallGeo = new THREE.BoxGeometry(width, wallHeight, depth);
            const wall = new THREE.Mesh(wallGeo, wallMaterial);
            wall.position.set(x, wallHeight / 2, z);
            scene.add(wall);
        }

        createWall(0, -halfMap, mapSize, wallThickness);
        createWall(0, halfMap, mapSize, wallThickness);
        createWall(-halfMap, 0, wallThickness, mapSize);
        createWall(halfMap, 0, wallThickness, mapSize);

        // 5. Car Body
        const carGeometry = new THREE.BoxGeometry(2, 1, 4);
        const carMaterial = new THREE.MeshStandardMaterial({ color: 0xb8a47e, metalness: 0.5, roughness: 0.3 });
        const car = new THREE.Mesh(carGeometry, carMaterial);
        car.position.y = 0.5;
        scene.add(car);

        // 6. Keyboard State
        const keys = { forward: false, backward: false, left: false, right: false };

        window.addEventListener('keydown', (e) => updateKey(e, true));
        window.addEventListener('keyup', (e) => updateKey(e, false));

        function updateKey(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': keys.forward = isDown; break;
                case 's': case 'arrowdown': keys.backward = isDown; break;
                case 'a': case 'arrowleft': keys.left = isDown; break;
                case 'd': case 'arrowright': keys.right = isDown; break;
            }
        }

        // 7. Physics & Drive Variables
        let speed = 0;
        let maxSpeed = 0.9;
        let acceleration = 0.015;
        let deceleration = 0.008;
        let turnSpeed = 0.04;
        let carAngle = 0;

        const limit = halfMap - 3;

        // DOM References
        const needleContainer = document.getElementById('needle-container');
        const digitalSpeed = document.getElementById('digital-speed');
        const gearIndicator = document.getElementById('gear-indicator');

        // 8. Game Loop
        function animate() {
            requestAnimationFrame(animate);

            if (keys.forward) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else if (keys.backward) {
                speed = Math.max(speed - acceleration, -maxSpeed / 2);
            } else {
                if (speed > 0) speed = Math.max(speed - deceleration, 0);
                if (speed < 0) speed = Math.min(speed + deceleration, 0);
            }

            if (Math.abs(speed) > 0.005) {
                let currentTurn = turnSpeed * (speed / maxSpeed);
                if (keys.left) carAngle += currentTurn * 1.5;
                if (keys.right) carAngle -= currentTurn * 1.5;
            }

            car.rotation.y = carAngle;
            car.position.x += Math.sin(carAngle) * speed;
            car.position.z += Math.cos(carAngle) * speed;

            let crashed = false;
            if (car.position.x > limit) { car.position.x = limit; crashed = true; }
            if (car.position.x < -limit) { car.position.x = -limit; crashed = true; }
            if (car.position.z > limit) { car.position.z = limit; crashed = true; }
            if (car.position.z < -limit) { car.position.z = -limit; crashed = true; }

            if (crashed) {
                speed = -speed * 0.5;
            }

            // --- GAUGE UPDATES ---
            const kmh = Math.round(Math.abs(speed) * 300);
            digitalSpeed.innerText = `${kmh} KM/H`;

            // Needle angle mapping: -135deg (0 km/h) to +135deg (300 km/h)
            const needleAngle = -135 + (Math.min(kmh, 300) / 300) * 270;
            needleContainer.style.transform = `rotate(${needleAngle}deg)`;

            // Gear Shift Logic
            if (Math.abs(speed) < 0.01) {
                gearIndicator.innerText = "P";
            } else if (speed < 0) {
                gearIndicator.innerText = "R";
            } else {
                if (kmh < 60) gearIndicator.innerText = "1";
                else if (kmh < 120) gearIndicator.innerText = "2";
                else if (kmh < 180) gearIndicator.innerText = "3";
                else if (kmh < 240) gearIndicator.innerText = "4";
                else gearIndicator.innerText = "5";
            }

            // Smooth Camera Follow
            const targetCameraX = car.position.x - Math.sin(carAngle) * 12;
            const targetCameraZ = car.position.z - Math.cos(carAngle) * 12;
            camera.position.x += (targetCameraX - camera.position.x) * 0.1;
            camera.position.z += (targetCameraZ - camera.position.z) * 0.1;
            camera.position.y = car.position.y + 5;
            
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
