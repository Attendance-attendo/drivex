<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX - Fixed Brake Physics</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #d4c39e;
            background: rgba(20,20,20,0.85);
            padding: 12px 18px;
            border-radius: 8px;
            border: 2px solid #b8a47e;
            pointer-events: none;
        }
        
        #gauge-canvas {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3 style="margin: 0 0 5px 0;">DriveX - Fixed Brake Physics</h3>
        <p style="margin: 3px 0;">Use <b>W</b> / <b>Up</b> to Accelerate, <b>S</b> / <b>Down</b> to Brake/Reverse.</p>
        <p style="margin: 3px 0; color: #ffcc00;"><b>Hold SPACEBAR</b> to engage Handbrake for Drifting!</p>
    </div>

    <canvas id="gauge-canvas" width="400" height="400"></canvas>

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // -----------------------------------------------------------
        // 1. CANVAS ANTIQUE GAUGE RENDERER
        // -----------------------------------------------------------
        const canvas = document.getElementById('gauge-canvas');
        const ctx = canvas.getContext('2d');

        function drawGauge(kmh, gear) {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = 180;

            ctx.clearRect(0, 0, w, h);

            const gradBezel = ctx.createRadialGradient(cx, cy, radius - 15, cx, cy, radius);
            gradBezel.addColorStop(0, '#e5d8b5');
            gradBezel.addColorStop(0.5, '#a6936d');
            gradBezel.addColorStop(1, '#4a3e28');
            
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradBezel;
            ctx.fill();

            const gradFace = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius - 15);
            gradFace.addColorStop(0, '#f8f4eb');
            gradFace.addColorStop(0.85, '#eee5d3');
            gradFace.addColorStop(1, '#d8cbaf');
            
            ctx.beginPath();
            ctx.arc(cx, cy, radius - 15, 0, Math.PI * 2);
            ctx.fillStyle = gradFace;
            ctx.fill();

            ctx.fillStyle = '#3a3325';
            ctx.font = 'bold 13px "Times New Roman"';
            ctx.textAlign = 'center';
            ctx.fillText('BETHLEHEM STEEL CO.', cx, cy - 85);
            ctx.font = 'bold 12px "Times New Roman"';
            ctx.fillText('COMPRESSED AIR', cx, cy + 95);

            ctx.fillStyle = 'rgba(0,0,0,0.06)';
            ctx.fillRect(cx - 16, cy - 65, 32, 26);
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(cx - 16, cy - 65, 32, 26);

            ctx.fillStyle = '#a02020';
            ctx.font = 'bold 20px monospace';
            ctx.fillText(gear, cx, cy - 45);

            ctx.fillStyle = '#444';
            ctx.font = 'bold 16px monospace';
            ctx.fillText(`${kmh} KM/H`, cx, cy + 125);

            const minAngle = -135 * (Math.PI / 180);
            const maxAngle = 135 * (Math.PI / 180);
            const totalSteps = 12;

            for (let i = 0; i <= totalSteps; i++) {
                const angle = minAngle + (i / totalSteps) * (maxAngle - minAngle) - (Math.PI / 2);
                
                const innerR = radius - 30;
                const outerR = radius - 18;
                const x1 = cx + innerR * Math.cos(angle);
                const y1 = cy + innerR * Math.sin(angle);
                const x2 = cx + outerR * Math.cos(angle);
                const y2 = cy + outerR * Math.sin(angle);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 3;
                ctx.stroke();

                const numR = radius - 48;
                const nx = cx + numR * Math.cos(angle);
                const ny = cy + numR * Math.sin(angle) + 5;
                ctx.fillStyle = '#111';
                ctx.font = 'bold 17px "Courier New"';
                ctx.fillText(i * 25, nx, ny);
            }

            const speedClamped = Math.min(kmh, 300);
            const needleAngle = minAngle + (speedClamped / 300) * (maxAngle - minAngle) - (Math.PI / 2);
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(needleAngle + Math.PI / 2);

            ctx.beginPath();
            ctx.moveTo(-3, 15);
            ctx.lineTo(3, 15);
            ctx.lineTo(1, -135);
            ctx.lineTo(-1, -135);
            ctx.closePath();
            ctx.fillStyle = '#1a1a1a';
            ctx.fill();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // -----------------------------------------------------------
        // 2. THREE.JS GAME SCENE
        // -----------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        const mapSize = 180;
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(mapSize, mapSize),
            new THREE.MeshStandardMaterial({ color: 0x2b2b30, roughness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const grid = new THREE.GridHelper(mapSize, 40, 0x8c7853, 0x3a3a40);
        grid.position.y = 0.01;
        scene.add(grid);

        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x8c7853, roughness: 0.4 });
        const halfMap = mapSize / 2;
        function createWall(x, z, width, depth) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(width, 3, depth), wallMaterial);
            wall.position.set(x, 1.5, z);
            scene.add(wall);
        }
        createWall(0, -halfMap, mapSize, 2);
        createWall(0, halfMap, mapSize, 2);
        createWall(-halfMap, 0, 2, mapSize);
        createWall(halfMap, 0, 2, mapSize);

        const car = new THREE.Mesh(
            new THREE.BoxGeometry(2, 1, 4),
            new THREE.MeshStandardMaterial({ color: 0xb8a47e, metalness: 0.5, roughness: 0.3 })
        );
        car.position.y = 0.5;
        scene.add(car);

        // --- SKID MARK SYSTEM ---
        const skidMarks = [];
        const skidMaterial = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.85 });
        const skidGeo = new THREE.PlaneGeometry(0.35, 0.5);

        function spawnSkidMark(x, z, rotation) {
            const mark = new THREE.Mesh(skidGeo, skidMaterial.clone());
