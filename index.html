<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX - Phase 1 Sandbox</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff3333; }
        p { margin: 3px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div id="info">
        <h1>DriveX Prototype - Phase 1</h1>
        <p><strong>W / S</strong>: Accelerate / Reverse</p>
        <p><strong>A / D</strong>: Steer Left / Right</p>
        <p><strong>Space</strong>: Handbrake</p>
    </div>

    <!-- Import Three.js via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Scene, Camera, Renderer setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Ground Plane (Road/Grid)
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Add a grid helper for visual depth
        const grid = new THREE.GridHelper(200, 50, 0x555555, 0x222222);
        grid.position.y = 0.01;
        scene.add(grid);

        // 4. Simple Car Creation
        const carGroup = new THREE.Group();
        
        // Car Body
        const bodyGeo = new THREE.BoxGeometry(1.8, 0.8, 4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3, metalness: 0.8 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.6;
        carBody.castShadow = true;
        carGroup.add(carBody);

        // Car Cabin
        const cabinGeo = new THREE.BoxGeometry(1.4, 0.6, 2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.1 });
        const carCabin = new THREE.Mesh(cabinGeo, cabinMat);
        carCabin.position.set(0, 1.2, -0.2);
        carCabin.castShadow = true;
        carGroup.add(carCabin);

        // Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        
        const wheels = [];
        const wheelPositions = [
            [-1, 0.4, 1.3],  // Front Left
            [1, 0.4, 1.3],   // Front Right
            [-1, 0.4, -1.3], // Rear Left
            [1, 0.4, -1.3]   // Rear Right
        ];

        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            wheel.castShadow = true;
            carGroup.add(wheel);
            wheels.push(wheel);
        });

        scene.add(carGroup);
        carGroup.position.y = 0;

        // 5. Driving Physics Variables
        const controls = { forward: false, backward: false, left: false, right: false, brake: false };
        let speed = 0;
        let steering = 0;
        const maxSpeed = 0.4;
        const acceleration = 0.005;
        const deceleration = 0.008;
        const turnSpeed = 0.03;

        // Keyboard Event Listeners
        window.addEventListener('keydown', (e) => updateKey(e.code, true));
        window.addEventListener('keyup', (e) => updateKey(e.code, false));

        function updateKey(code, isDown) {
            switch(code) {
                case 'KeyW': controls.forward = isDown; break;
                case 'KeyS': controls.backward = isDown; break;
                case 'KeyA': controls.left = isDown; break;
                case 'KeyD': controls.right = isDown; break;
                case 'Space': controls.brake = isDown; break;
            }
        }

        // 6. Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Handle Acceleration & Braking
            if (controls.forward) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else if (controls.backward) {
                speed = Math.max(speed - acceleration, -maxSpeed / 2);
            } else {
                // Natural friction slow-down
                if (speed > 0) speed = Math.max(0, speed - deceleration);
                if (speed < 0) speed = Math.min(0, speed + deceleration);
            }

            if (controls.brake) {
                speed *= 0.9; // Hard brake
            }

            // Handle Steering
            if (controls.left) {
                steering = Math.min(steering + 0.02, 0.6);
            } else if (controls.right) {
                steering = Math.max(steering - 0.02, -0.6);
            } else {
                steering *= 0.8; // Return wheels to center
            }

            // Move Car
            if (Math.abs(speed) > 0.001) {
                carGroup.rotation.y += steering * (speed * 2);
                carGroup.translateZ(speed);
            }

            // Smooth Chase Camera Follow
            const idealOffset = new THREE.Vector3(0, 4, -8).applyQuaternion(carGroup.quaternion);
            const idealLookat = carGroup.position.clone().add(new THREE.Vector3(0, 1, 0));
            
            camera.position.lerp(carGroup.position.clone().add(idealOffset), 0.1);
            camera.lookAt(idealLookat);

            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
