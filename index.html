<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX - Canvas Antique Gauge</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #d4c39e;
            background: rgba(20,20,20,0.85);
            padding: 12px 18px;
            border-radius: 8px;
            border: 2px solid #b8a47e;
            pointer-events: none;
        }
        
        /* GAUGE CANVAS POSITIONING */
        #gauge-canvas {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3 style="margin: 0 0 5px 0;">DriveX - Canvas Gauge</h3>
        <p style="margin: 3px 0;">Use <b>WASD</b> or <b>Arrow Keys</b> to drive.</p>
    </div>

    <!-- CANVAS RETRO GAUGE -->
    <canvas id="gauge-canvas" width="400" height="400"></canvas>

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // -----------------------------------------------------------
        // 1. CANVAS ANTIQUE GAUGE RENDERER
        // -----------------------------------------------------------
        const canvas = document.getElementById('gauge-canvas');
        const ctx = canvas.getContext('2d');

        function drawGauge(kmh, gear) {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = 180;

            ctx.clearRect(0, 0, w, h);

            // A. Outer Brass Bezel
            const gradBezel = ctx.createRadialGradient(cx, cy, radius - 15, cx, cy, radius);
            gradBezel.addColorStop(0, '#e5d8b5');
            gradBezel.addColorStop(0.5, '#a6936d');
            gradBezel.addColorStop(1, '#4a3e28');
            
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradBezel;
            ctx.fill();

            // B. Parchment Dial Face
            const gradFace = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius - 15);
            gradFace.addColorStop(0, '#f8f4eb');
            gradFace.addColorStop(0.85, '#eee5d3');
            gradFace.addColorStop(1, '#d8cbaf');
            
            ctx.beginPath();
            ctx.arc(cx, cy, radius - 15, 0, Math.PI * 2);
            ctx.fillStyle = gradFace;
            ctx.fill();

            // C. Brand Text
            ctx.fillStyle = '#3a3325';
            ctx.font = 'bold 13px "Times New Roman"';
            ctx.textAlign = 'center';
            ctx.fillText('BETHLEHEM STEEL CO.', cx, cy - 85);

            ctx.font = 'bold 12px "Times New Roman"';
            ctx.fillText('COMPRESSED AIR', cx, cy + 95);

            // D. Gear Box
            ctx.fillStyle = 'rgba(0,0,0,0.06)';
            ctx.fillRect(cx - 16, cy - 65, 32, 26);
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(cx - 16, cy - 65, 32, 26);

            ctx.fillStyle = '#a02020';
            ctx.font = 'bold 20px monospace';
            ctx.fillText(gear, cx, cy - 45);

            // E. Digital Speed Text
            ctx.fillStyle = '#444';
            ctx.font = 'bold 16px monospace';
            ctx.fillText(`${kmh} KM/H`, cx, cy + 125);

            // F. Ticks and Numbers (-135 deg to +135 deg sweep)
            const minAngle = -135 * (Math.PI / 180);
            const maxAngle = 135 * (Math.PI / 180);
            const totalSteps = 12; // 0 to 300 step 25

            for (let i = 0; i <= totalSteps; i++) {
                const angle = minAngle + (i / totalSteps) * (maxAngle - minAngle) - (Math.PI / 2);
                
                // Tick mark
                const innerR = radius - 30;
                const outerR = radius - 18;
                const x1 = cx + innerR * Math.cos(angle);
                const y1 = cy + innerR * Math.sin(angle);
                const x2 = cx + outerR * Math.cos(angle);
                const y2 = cy + outerR * Math.sin(angle);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Numbers
                const numR = radius - 48;
                const nx = cx + numR * Math.cos(angle);
                const ny = cy + numR * Math.sin(angle) + 5;
                ctx.fillStyle = '#111';
                ctx.font = 'bold 17px "Courier New"';
                ctx.fillText(i * 25, nx, ny);
            }

            // G. Needle
            const speedClamped = Math.min(kmh, 300);
            const needleAngle = minAngle + (speedClamped / 300) * (maxAngle - minAngle) - (Math.PI / 2);
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(needleAngle + Math.PI / 2);

            ctx.beginPath();
            ctx.moveTo(-3, 15);
            ctx.lineTo(3, 15);
            ctx.lineTo(1, -135);
            ctx.lineTo(-1, -135);
            ctx.closePath();
            ctx.fillStyle = '#1a1a1a';
            ctx.fill();

            ctx.restore();

            // H. Center Needle Hub
            ctx.beginPath();
            ctx.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // -----------------------------------------------------------
        // 2. THREE.JS GAME SCENE
        // -----------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        const mapSize = 180;
        const groundGeometry = new THREE.PlaneGeometry(mapSize, mapSize);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x2b2b30, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const grid = new THREE.GridHelper(mapSize, 40, 0x8c7853, 0x3a3a40);
        grid.position.y = 0.01;
        scene.add(grid);

        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x8c7853, roughness: 0.4 });
        const wallHeight = 3;
        const wallThickness = 2;
        const halfMap = mapSize / 2;

        function createWall(x, z, width, depth) {
            const wallGeo = new THREE.BoxGeometry(width, wallHeight, depth);
            const wall = new THREE.Mesh(wallGeo, wallMaterial);
            wall.position.set(x, wallHeight / 2, z);
            scene.add(wall);
        }

        createWall(0, -halfMap, mapSize, wallThickness);
        createWall(0, halfMap, mapSize, wallThickness);
        createWall(-halfMap, 0, wallThickness, mapSize);
        createWall(halfMap, 0, wallThickness, mapSize);

        const carGeometry = new THREE.BoxGeometry(2, 1, 4);
        const carMaterial = new THREE.MeshStandardMaterial({ color: 0xb8a47e, metalness: 0.5, roughness: 0.3 });
        const car = new THREE.Mesh(carGeometry, carMaterial);
        car.position.y = 0.5;
        scene.add(car);

        const keys = { forward: false, backward: false, left: false, right: false };

        window.addEventListener('keydown', (e) => updateKey(e, true));
        window.addEventListener('keyup', (e) => updateKey(e, false));

        function updateKey(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': keys.forward = isDown; break;
                case 's': case 'arrowdown': keys.backward = isDown; break;
                case 'a': case 'arrowleft': keys.left = isDown; break;
                case 'd': case 'arrowright': keys.right = isDown; break;
            }
        }

        let speed = 0;
        let maxSpeed = 0.9;
        let acceleration = 0.015;
        let deceleration = 0.008;
        let turnSpeed = 0.04;
        let carAngle = 0;

        const limit = halfMap - 3;

        // -----------------------------------------------------------
        // 3. ANIMATION LOOP
        // -----------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);

            if (keys.forward) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else if (keys.backward) {
                speed = Math.max(speed - acceleration, -maxSpeed / 2);
            } else {
                if (speed > 0) speed = Math.max(speed - deceleration, 0);
                if (speed < 0) speed = Math.min(speed + deceleration, 0);
            }

            if (Math.abs(speed) > 0.005) {
                let currentTurn = turnSpeed * (speed / maxSpeed);
                if (keys.left) carAngle += currentTurn * 1.5;
                if (keys.right) carAngle -= currentTurn * 1.5;
            }

            car.rotation.y = carAngle;
            car.position.x += Math.sin(carAngle) * speed;
            car.position.z += Math.cos(carAngle) * speed;

            let crashed = false;
            if (car.position.x > limit) { car.position.x = limit; crashed = true; }
            if (car.position.x < -limit) { car.position.x = -limit; crashed = true; }
            if (car.position.z > limit) { car.position.z = limit; crashed = true; }
            if (car.position.z < -limit) { car.position.z = -limit; crashed = true; }

            if (crashed) {
                speed = -speed * 0.5;
            }

            // Speed & Gear calculation
            const kmh = Math.round(Math.abs(speed) * 300);
            let gear = "P";
            if (Math.abs(speed) < 0.01) gear = "P";
            else if (speed < 0) gear = "R";
            else {
                if (kmh < 60) gear = "1";
                else if (kmh < 120) gear = "2";
                else if (kmh < 180) gear = "3";
                else if (kmh < 240) gear = "4";
                else gear = "5";
            }

            // Render Canvas Gauge
            drawGauge(kmh, gear);

            // Camera follow
            const targetCameraX = car.position.x - Math.sin(carAngle) * 12;
            const targetCameraZ = car.position.z - Math.cos(carAngle) * 12;
            camera.position.x += (targetCameraX - camera.position.x) * 0.1;
            camera.position.z += (targetCameraZ - camera.position.z) * 0.1;
            camera.position.y = car.position.y + 5;
            
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
