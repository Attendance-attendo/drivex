<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX - Smooth Drift Tuned</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #d4c39e;
            background: rgba(20,20,20,0.85);
            padding: 12px 18px;
            border-radius: 8px;
            border: 2px solid #b8a47e;
            pointer-events: none;
        }
        
        #gauge-canvas {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3 style="margin: 0 0 5px 0;">DriveX - Smooth Drift Tuned</h3>
        <p style="margin: 3px 0;">Use <b>W / Up</b> to Accelerate, <b>S / Down</b> to Brake/Reverse.</p>
        <p style="margin: 3px 0; color: #ffcc00;"><b>Hold SPACEBAR</b> while turning for smooth, sweeping drifts!</p>
    </div>

    <canvas id="gauge-canvas" width="400" height="400"></canvas>

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // -----------------------------------------------------------
        // 1. CANVAS ANTIQUE GAUGE RENDERER
        // -----------------------------------------------------------
        const canvas = document.getElementById('gauge-canvas');
        const ctx = canvas.getContext('2d');

        function drawGauge(kmh, gear) {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = 180;

            ctx.clearRect(0, 0, w, h);

            const gradBezel = ctx.createRadialGradient(cx, cy, radius - 15, cx, cy, radius);
            gradBezel.addColorStop(0, '#e5d8b5');
            gradBezel.addColorStop(0.5, '#a6936d');
            gradBezel.addColorStop(1, '#4a3e28');
            
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradBezel;
            ctx.fill();

            const gradFace = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius - 15);
            gradFace.addColorStop(0, '#f8f4eb');
            gradFace.addColorStop(0.85, '#eee5d3');
            gradFace.addColorStop(1, '#d8cbaf');
            
            ctx.beginPath();
            ctx.arc(cx, cy, radius - 15, 0, Math.PI * 2);
            ctx.fillStyle = gradFace;
            ctx.fill();

            ctx.fillStyle = '#3a3325';
            ctx.font = 'bold 13px "Times New Roman"';
            ctx.textAlign = 'center';
            ctx.fillText('BETHLEHEM STEEL CO.', cx, cy - 85);
            ctx.font = 'bold 12px "Times New Roman"';
            ctx.fillText('COMPRESSED AIR', cx, cy + 95);

            ctx.fillStyle = 'rgba(0,0,0,0.06)';
            ctx.fillRect(cx - 16, cy - 65, 32, 26);
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(cx - 16, cy - 65, 32, 26);

            ctx.fillStyle = '#a02020';
            ctx.font = 'bold 20px monospace';
            ctx.fillText(gear, cx, cy - 45);

            ctx.fillStyle = '#444';
            ctx.font = 'bold 16px monospace';
            ctx.fillText(kmh + ' KM/H', cx, cy + 125);

            const minAngle = -135 * (Math.PI / 180);
            const maxAngle = 135 * (Math.PI / 180);
            const totalSteps = 12;

            for (let i = 0; i <= totalSteps; i++) {
                const angle = minAngle + (i / totalSteps) * (maxAngle - minAngle) - (Math.PI / 2);
                
                const innerR = radius - 30;
                const outerR = radius - 18;
                const x1 = cx + innerR * Math.cos(angle);
                const y1 = cy + innerR * Math.sin(angle);
                const x2 = cx + outerR * Math.cos(angle);
                const y2 = cy + outerR * Math.sin(angle);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 3;
                ctx.stroke();

                const numR = radius - 48;
                const nx = cx + numR * Math.cos(angle);
                const ny = cy + numR * Math.sin(angle) + 5;
                ctx.fillStyle = '#111';
                ctx.font = 'bold 17px "Courier New"';
                ctx.fillText(i * 25, nx, ny);
            }

            const speedClamped = Math.min(kmh, 300);
            const needleAngle = minAngle + (speedClamped / 300) * (maxAngle - minAngle) - (Math.PI / 2);
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(needleAngle + Math.PI / 2);

            ctx.beginPath();
            ctx.moveTo(-3, 15);
            ctx.lineTo(3, 15);
            ctx.lineTo(1, -135);
            ctx.lineTo(-1, -135);
            ctx.closePath();
            ctx.fillStyle = '#1a1a1a';
            ctx.fill();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // -----------------------------------------------------------
        // 2. THREE.JS GAME SCENE
        // -----------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        const mapSize = 180;
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(mapSize, mapSize),
            new THREE.MeshStandardMaterial({ color: 0x2b2b30, roughness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const grid = new THREE.GridHelper(mapSize, 40, 0x8c7853, 0x3a3a40);
        grid.position.y = 0.01;
        scene.add(grid);

        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x8c7853, roughness: 0.4 });
        const halfMap = mapSize / 2;
        function createWall(x, z, width, depth) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(width, 3, depth), wallMaterial);
            wall.position.set(x, 1.5, z);
            scene.add(wall);
        }
        createWall(0, -halfMap, mapSize, 2);
        createWall(0, halfMap, mapSize, 2);
        createWall(-halfMap, 0, 2, mapSize);
        createWall(halfMap, 0, 2, mapSize);

        const car = new THREE.Mesh(
            new THREE.BoxGeometry(2, 1, 4),
            new THREE.MeshStandardMaterial({ color: 0xb8a47e, metalness: 0.5, roughness: 0.3 })
        );
        car.position.y = 0.5;
        scene.add(car);

        // --- SKID MARK SYSTEM ---
        const skidMarks = [];
        const skidMaterial = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.85 });
        const skidGeo = new THREE.PlaneGeometry(0.35, 0.6);

        function spawnSkidMark(x, z, rotation) {
            const mark = new THREE.Mesh(skidGeo, skidMaterial.clone());
            mark.rotation.x = -Math.PI / 2;
            mark.rotation.z = rotation;
            mark.position.set(x, 0.02, z);
            scene.add(mark);
            skidMarks.push({ mesh: mark, life: 1.0 });

            if (skidMarks.length > 500) {
                const oldMark = skidMarks.shift();
                scene.remove(oldMark.mesh);
            }
        }

        // Input Mapping
        const keys = { forward: false, brake: false, left: false, right: false, handbrake: false };

        window.addEventListener('keydown', (e) => updateKey(e, true));
        window.addEventListener('keyup', (e) => updateKey(e, false));

        function updateKey(e, isDown) {
            if (e.code === 'Space') { keys.handbrake = isDown; e.preventDefault(); return; }
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': keys.forward = isDown; break;
                case 's': case 'arrowdown': keys.brake = isDown; break;
                case 'a': case 'arrowleft': keys.left = isDown; break;
                case 'd': case 'arrowright': keys.right = isDown; break;
            }
        }

        // Physics & Tuning Variables
        let speed = 0;
        let maxSpeed = 0.9;
        let acceleration = 0.012;
        let brakeForce = 0.018;      // Softer brake so you don't instantly stop
        let handbrakeDrag = 0.008;   // Gentle drift friction to maintain momentum
        let naturalDecel = 0.004;
        let turnSpeed = 0.032;
        let carAngle = 0;
        let velocityX = 0;
        let velocityZ = 0;

        const limit = halfMap - 3;

        // -----------------------------------------------------------
        // 3. ANIMATION LOOP
        // -----------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);

            // Acceleration & Braking
            if (keys.handbrake) {
                // Smooth handbrake slide: maintains speed much better while turning
                speed = Math.max(speed - handbrakeDrag, 0.1);
            } else if (keys.brake) {
                if (speed > 0) {
                    speed = Math.max(speed - brakeForce, 0);
                } else {
                    speed = Math.max(speed - acceleration * 0.8, -maxSpeed / 2);
                }
            } else if (keys.forward) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else {
                if (speed > 0) speed = Math.max(speed - naturalDecel, 0);
                if (speed < 0) speed = Math.min(speed + naturalDecel, 0);
            }

            // Steering with Drift Inertia
            if (Math.abs(speed) > 0.005) {
                let currentTurn = turnSpeed * (Math.abs(speed) / maxSpeed);
                if (keys.handbrake) currentTurn *= 1.3; // Balanced turn rate for wide, clean half-circles
                if (keys.left) carAngle += currentTurn * Math.sign(speed);
                if (keys.right) carAngle -= currentTurn * Math.sign(speed);
            }

            const forwardX = Math.sin(carAngle) * speed;
            const forwardZ = Math.cos(carAngle) * speed;

            // Momentum blending during handbrake drift
            if (keys.handbrake && Math.abs(speed) > 0.2) {
                velocityX = velocityX * 0.96 + forwardX * 0.04; // High inertia carry
                velocityZ = velocityZ * 0.96 + forwardZ * 0.04;
            } else {
                velocityX = velocityX * 0.8 + forwardX * 0.2;
                velocityZ = velocityZ * 0.8 + forwardZ * 0.2;
            }

            // Spawn Skid Marks when sliding or braking at speed
            if ((keys.handbrake || keys.brake) && Math.abs(speed) > 0.25) {
                const rearOffsetX = Math.sin(carAngle) * -1.5;
                const rearOffsetZ = Math.cos(carAngle) * -1.5;
                const sideOffsetX = Math.cos(carAngle) * 0.85;
                const sideOffsetZ = Math.sin(carAngle) * -0.85;

                const rx = car.position.x + rearOffsetX;
                const rz = car.position.z + rearOffsetZ;

                spawnSkidMark(rx - sideOffsetX, rz - sideOffsetZ, carAngle);
                spawnSkidMark(rx + sideOffsetX, rz + sideOffsetZ, carAngle);
            }

            car.rotation.y = carAngle;
            car.position.x += velocityX;
            car.position.z += velocityZ;

            // Slow fade on skid marks so they stay visible longer
            for (let i = skidMarks.length - 1; i >= 0; i--) {
                skidMarks[i].life -= 0.0015; 
                skidMarks[i].mesh.material.opacity = skidMarks[i].life * 0.85;
                if (skidMarks[i].life <= 0) {
                    scene.remove(skidMarks[i].mesh);
                    skidMarks.splice(i, 1);
                }
            }

            // Crash Boundaries
            let crashed = false;
            if (car.position.x > limit) { car.position.x = limit; crashed = true; }
            if (car.position.x < -limit) { car.position.x = -limit; crashed = true; }
            if (car.position.z > limit) { car.position.z = limit; crashed = true; }
            if (car.position.z < -limit) { car.position.z = -limit; crashed = true; }

            if (crashed) {
                speed = -speed * 0.4;
                velocityX = 0;
                velocityZ = 0;
            }

            // Speed & Gear
            const kmh = Math.round(Math.abs(speed) * 300);
            let gear = "P";
            if (Math.abs(speed) < 0.01) gear = "P";
            else if (speed < 0) gear = "R";
            else {
                if (kmh < 60) gear = "1";
                else if (kmh < 120) gear = "2";
                else if (kmh < 180) gear = "3";
                else if (kmh < 240) gear = "4";
                else gear = "5";
            }

            drawGauge(kmh, gear);

            // Camera follow
            const targetCameraX = car.position.x - Math.sin(carAngle) * 12;
            const targetCameraZ = car.position.z - Math.cos(carAngle) * 12;
            camera.position.x += (targetCameraX - camera.position.x) * 0.1;
            camera.position.z += (targetCameraZ - camera.position.z) * 0.1;
            camera.position.y = car.position.y + 5;
            
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
