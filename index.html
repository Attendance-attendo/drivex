<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX - Phase 1 Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>DriveX - Phase 1</h3>
        <p>Use <b>WASD</b> or <b>Arrow Keys</b> to drive.</p>
        <p><b>Tip:</b> Hold Forward + Left/Right to spin 360 degrees!</p>
    </div>

    <!-- Load Three.js from a public library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Scene, Camera, and Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 3. Create Ground (Road)
        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Add a grid helper to see movement better
        const grid = new THREE.GridHelper(200, 50, 0x555555, 0x222222);
        grid.position.y = 0.01;
        scene.add(grid);

        // 4. Create a Simple Car (Placeholder Box)
        const carGeometry = new THREE.BoxGeometry(2, 1, 4);
        const carMaterial = new THREE.MeshStandardMaterial({ color: 0x0077ff, metalness: 0.5, roughness: 0.2 });
        const car = new THREE.Mesh(carGeometry, carMaterial);
        car.position.y = 0.5;
        scene.add(car);

        // Position camera behind the car
        camera.position.set(0, 5, -10);
        camera.lookAt(car.position);

        // 5. Input Controls State (Supports WASD and Arrow Keys)
        const keys = { forward: false, backward: false, left: false, right: false };

        window.addEventListener('keydown', (e) => updateKey(e, true));
        window.addEventListener('keyup', (e) => updateKey(e, false));

        function updateKey(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': keys.forward = isDown; break;
                case 's': case 'arrowdown': keys.backward = isDown; break;
                case 'a': case 'arrowleft': keys.left = isDown; break;
                case 'd': case 'arrowright': keys.right = isDown; break;
            }
        }

        // 6. Car Physics Variables
        let speed = 0;
        let maxSpeed = 0.6;
        let acceleration = 0.015;
        let deceleration = 0.008;
        let turnSpeed = 0.04;
        let carAngle = 0;

        // 7. Animation / Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Handle Acceleration & Braking
            if (keys.forward) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else if (keys.backward) {
                speed = Math.max(speed - acceleration, -maxSpeed / 2);
            } else {
                // Natural slow down
                if (speed > 0) speed = Math.max(speed - deceleration, 0);
                if (speed < 0) speed = Math.min(speed + deceleration, 0);
            }

            // Handle Steering (Allows sharp spinning / 360s when moving)
            if (Math.abs(speed) > 0.005) {
                let currentTurn = turnSpeed * (speed / maxSpeed);
                if (keys.left) carAngle += currentTurn * 1.5; // Slightly boosted turn rate for 360 spins
                if (keys.right) carAngle -= currentTurn * 1.5;
            }

            // Update Car Position
            car.rotation.y = carAngle;
            car.position.x += Math.sin(carAngle) * speed;
            car.position.z += Math.cos(carAngle) * speed;

            // Smooth Camera Follow
            const targetCameraX = car.position.x - Math.sin(carAngle) * 10;
            const targetCameraZ = car.position.z - Math.cos(carAngle) * 10;
            camera.position.x += (targetCameraX - camera.position.x) * 0.1;
            camera.position.z += (targetCameraZ - camera.position.z) * 0.1;
            camera.position.y = car.position.y + 4;
            
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
